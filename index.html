<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Acc Game</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .product {
        background: white;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      .product img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .product img:hover {
        transform: scale(1.03);
      }

      .product h3 {
        font-size: 16px;
        color: #444;
        margin: 10px 0;
        min-height: 40px;
      }

      .product button {
        background: #ff4757;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        transition: background 0.2s;
      }

      .product button:hover {
        background: #ff6b81;
      }

      .loading {
        text-align: center;
        font-size: 18px;
        color: #666;
        margin-top: 20px;
      }

      .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .popup img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 5px;
      }

      .popup span {
        position: absolute;
        top: 20px;
        right: 40px;
        font-size: 40px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>SHOP ACC GAME</h1>

    <div id="loading" class="loading">Đang tải danh sách tài khoản từ Telegram...</div>
    <div id="products" class="products"></div>

    <div id="popup" class="popup" onclick="closeImg()">
      <span>&times;</span>
      <img id="popup-img" />
    </div>

    <script>
      async function loadAcc() {
        let token = "8257254524:AAGwFDotvQfd3kxdgrpdTvSqS7gHlK5dBbo";
        let list = document.getElementById("products");
        let loadingEl = document.getElementById("loading");

        try {
          let res = await fetch(`https://api.telegram.org/bot${token}/getUpdates`);
          let data = await res.json();

          loadingEl.style.display = "none";

          if (!data.ok || !data.result || data.result.length === 0) {
            list.innerHTML = "<p style='text-align:center; width:100%'>Chưa có bài đăng nào trên kênh hoặc Bot chưa được thêm làm Admin của kênh.</p>";
            return;
          }

          let htmlContent = "";

          for (let m of data.result) {
            let post = m.channel_post || m.message;
            if (post && post.photo) {
              let photo = post.photo;
              let fileId = photo[photo.length - 1].file_id;

              // Lấy file_path từ Telegram
              let fileRes = await fetch(`https://api.telegram.org/bot${token}/getFile?file_id=${fileId}`);
              let fileData = await fileRes.json();

              if (fileData.ok) {
                let filePath = fileData.result.file_path;
                let imgUrl = `https://api.telegram.org/file/bot${token}/${filePath}`;
                let text = post.caption || "Tài khoản game";

                htmlContent += `
                  <div class="product">
                    <img src="${imgUrl}" onclick="openImg('${imgUrl}')" alt="Ảnh acc game">
                    <h3>${text}</h3>
                    <button onclick="buy('${text}')">Mua ngay</button>
                  </div>
                `;
              }
            }
          }

          if (htmlContent === "") {
            list.innerHTML = "<p style='text-align:center; width:100%'>Không tìm thấy hình ảnh nào trong các bài đăng gần đây.</p>";
          } else {
            list.innerHTML = htmlContent;
          }

        } catch (error) {
          loadingEl.innerText = "Có lỗi xảy ra khi kết nối tới Telegram!";
          console.error(error);
        }
      }

      function buy(accountName) {
        // Có thể tùy biến nội dung nhắn tin Zalo nếu muốn
        window.open("https://zalo.me/0869697154", "_blank");
      }

      function openImg(src) {
        document.getElementById("popup").style.display = "flex";
        document.getElementById("popup-img").src = src;
      }

      function closeImg() {
        document.getElementById("popup").style.display = "none";
      }

      loadAcc();
    </script>
  </body>
</html>
